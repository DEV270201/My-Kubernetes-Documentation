apiVersion: v1
kind: Pod
metadata:
  name: lp-probe
  labels:
    test: liveness-probe
spec:
  containers:
  - name: liveness
    image: registry.k8s.io/e2e-test-images/agnhost:2.48
    args:
    - liveness
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        httpHeaders:
        - name: Custom-Header
          value: Value
      initialDelaySeconds: 3
      periodSeconds: 3 